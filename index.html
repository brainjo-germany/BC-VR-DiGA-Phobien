/* brainjo-Passwortseite: Lila, Blau, Grün aus dem Designsystem, Lato */
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
:root{--lila:#6c67e4;--blau:#2a8aff;--gruen:#22a872;--fg:#2B2F45;--muted:#6B7084;--line:#dcdeeb;--bg:#f7f7fc;--card:#fff}
*{box-sizing:border-box}
.staticrypt-html,.staticrypt-body{height:100%;margin:0}
.staticrypt-body{font-family:"Lato","Helvetica Neue",Arial,sans-serif;color:var(--fg);background:var(--bg);
  background-image:radial-gradient(ellipse 70% 55% at 15% 0%,rgba(108,103,228,.16),transparent 60%),radial-gradient(ellipse 60% 50% at 95% 100%,rgba(42,138,255,.14),transparent 60%)}
.hidden{display:none!important}
.staticrypt-content{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.staticrypt-page{width:100%;max-width:440px}
.staticrypt-form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 34px 30px;box-shadow:0 18px 50px rgba(43,47,69,.10);position:relative;overflow:hidden}
.staticrypt-form::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--lila),var(--blau) 55%,var(--gruen))}
.brands{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.01em;font-size:21px;color:var(--fg)}
.brand .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--lila),var(--blau))}
.brand.schwabe{font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.brand.schwabe .dot{background:var(--gruen);border-radius:50%}
.brands .x{color:var(--muted);font-weight:400;font-size:18px}
.staticrypt-instructions{text-align:center}
.staticrypt-title{font-size:20px;font-weight:900;margin:0 0 6px;letter-spacing:-.01em}
.staticrypt-instructions p:last-child{margin:0;color:var(--muted);font-size:14px}
.staticrypt-hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.staticrypt-password-container{position:relative;display:flex}
#staticrypt-password{width:100%;font:inherit;font-size:15px;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#f4f5fb;color:var(--fg);outline:none}
#staticrypt-password:focus{border-color:var(--blau);background:#fff;box-shadow:0 0 0 3px rgba(42,138,255,.18)}
.staticrypt-toggle-password-visibility{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:20px;opacity:.5;cursor:pointer}
.staticrypt-remember{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:13px;color:var(--muted);cursor:pointer}
.staticrypt-remember input{accent-color:var(--lila)}
.staticrypt-decrypt-button{width:100%;margin-top:16px;font:inherit;font-weight:900;font-size:15px;color:#fff;border:0;border-radius:10px;padding:13px;cursor:pointer;
  background:linear-gradient(90deg,var(--lila),var(--blau));box-shadow:0 8px 20px rgba(42,138,255,.28);transition:transform .08s,box-shadow .12s}
.staticrypt-decrypt-button:hover{box-shadow:0 10px 24px rgba(42,138,255,.36)}
.staticrypt-decrypt-button:active{transform:translateY(1px)}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--lila);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style>
